services:
  trifitness:
    build: .
    container_name: trifitness
    restart: unless-stopped
    ports:
      - "9999:9999"
    volumes:
      # Monta la cartella data locale per salvare le ricette e il piano su disco
      - ./data:/app/data
    environment:
      - TZ=Europe/Rome
      - PORT=9999
